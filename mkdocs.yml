site_name: OfferReady
site_description: OfferReady — Production AI Engineering & FDE interview prep. Learn, build, defend your decisions, and land the offer. Advanced question banks, model answers, and interactive practice for AI/GenAI, data, and FDE roles.
site_url: https://klnjoy.github.io/offerready/
copyright: © 2026 OfferReady · Learn. Build. Defend. Interview.

# All markdown is copied into docs/ by sync_docs.py before building.
docs_dir: docs

# Flat .html URLs so module pages and their copied files/ assets share a base
# path (links resolve without ../ and also work when opened from disk).
use_directory_urls: false

# The heavy module files (PDFs, notebooks, diagrams ~470MB) are copied into
# site/ separately and incrementally by sync_docs.py, NOT by mkdocs — this keeps
# `mkdocs build` fast (only the markdown pages) and avoids re-copying every time.
exclude_docs: |
  Course-Modules/files/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: material/github
  # primary/accent are "custom" so the OfferReady navy+green palette defined in
  # assets/extra.css (--md-primary-fg-color / --md-accent-fg-color) drives the
  # header, links, and controls in both light and dark schemes.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    # Plain collapsible left-sidebar nav: groups start COLLAPSED and expand when
    # you click the chevron (no navigation.sections which broke drill-down, and
    # no navigation.expand which force-opened everything on every refresh).
    # navigation.indexes lets a section's index page act as its landing.
    - navigation.indexes
    - navigation.top
    # Right-hand table of contents for the current page.
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

plugins:
  - search

extra_css:
  - assets/extra.css

extra_javascript:
  # Must load first: sets window.OFFERREADY_API_BASE for chatbot.js + analyze.js.
  - assets/api-config.js
  - assets/mermaid-init.js
  - assets/chatbot.js
  - assets/practice.js
  - assets/progress.js
  - assets/why.js
  - assets/analyze.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

