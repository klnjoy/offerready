{% extends "base.html" %}
{% block extrahead %}
{{ super() }}
<script>
  /* Inside the OfferReady app's reader (an iframe), the app already shows the
     logo, a Back bar and its own Ask OfferReady button: mark the page so the
     library hides its own copies (see extra.css, "or-embedded"). */
  (function () {
    try { if (window.self !== window.top) document.documentElement.classList.add("or-embedded"); }
    catch (e) { document.documentElement.classList.add("or-embedded"); }
  })();
</script>
<script>
  /* The study library lives at getofferready.app/library/. Old github.io
     links forward there (same page, same anchor). Runs only on github.io, so
     the copy served through getofferready.app is never redirected. */
  (function () {
    if (location.hostname !== "klnjoy.github.io") return;
    var rest = location.pathname.replace(/^\/offerready\/?/, "");
    location.replace("https://getofferready.app/library/" + rest + location.search + location.hash);
  })();
</script>
{% endblock %}
